name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run pytest -m 'not integration' --junitxml=test-results/unit.xml
      - run: uv build --wheel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-results
          path: |
            test-results/
            dist/
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Prepare Jupyter dependencies in the CI environment
        run: uv pip install 'jupyterlab>=4,<5' 'jupyter-collaboration>=4,<5' 'ipykernel>=6,<8' 'jupyter-mcp-server==1.1.4' 'code-sandboxes==0.17.0'
      - name: Exercise real MCP and Jupyter processes
        run: uv run --no-sync pytest tests/test_server.py --junitxml=test-results/integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: test-results/
          if-no-files-found: ignore
